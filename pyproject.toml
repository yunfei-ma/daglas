[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daglas"
description = "Daily Swedish Lessons — structured lessons grounded in current context"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
daglas = "daglas.run:main"

[tool.setuptools.packages.find]
include = ["daglas", "daglas.*"]

[tool.setuptools.dynamic]
version = {attr = "daglas.__version__"}
